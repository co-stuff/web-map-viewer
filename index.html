<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Web Map Viewer</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.182.0/build/three.module.js"
    }
  }
  </script>
</head>

<body>
  <div id="app">
    <div id="menuBar">
      <button id="btnHamburger" aria-label="Toggle panel">&#9776;</button>
      <div class="menu-item" data-menu="file">
        <span class="menu-label">File</span>
        <div class="menu-dropdown">
          <button data-action="openWebMap">Open Web Map (Folder)</button>
          <button data-action="openZipMap">Open Web Map (ZIP - DBG)</button>
        </div>
      </div>
      <div class="menu-item" data-menu="maps">
        <span class="menu-label">Maps</span>
        <div class="menu-dropdown" id="mapsDropdown">
          <div id="mapsDropdownEmpty" class="menu-dropdown-empty">No maps available</div>
        </div>
      </div>
      <div class="menu-item" data-menu="view">
        <span class="menu-label">View</span>
        <div class="menu-dropdown">
          <button data-action="toggleAccess" class="checked">Show Access Grid</button>
          <button data-action="togglePortals" class="checked">Show Portals</button>
          <button data-action="toggleEffects" class="checked">Show Effects</button>
          <button data-action="toggleSounds" class="checked">Show Sounds</button>
          <button data-action="toggleCovers" class="checked">Show Covers</button>
          <button data-action="toggleScenes" class="checked">Show Scenes</button>
          <button data-action="toggleNpcs" class="checked">Show NPCs</button>
          <button data-action="toggleMobs" class="checked">Show Mobs</button>
          <hr>
          <button data-action="goTo" disabled>Go To...<kbd>Ctrl+G</kbd></button>
          <button data-action="centerMap" disabled>Center Map<kbd>Home</kbd></button>
          <button data-action="fitView" disabled>Fit to View<kbd>0</kbd></button>
        </div>
      </div>
      <div class="menu-item" data-menu="help">
        <span class="menu-label">Help</span>
        <div class="menu-dropdown">
          <button data-action="about">About</button>
        </div>
      </div>
    </div>

    <div id="panelBackdrop"></div>
    <div id="mainContent">
      <div id="viewport">
        <canvas id="overlayCanvas"></canvas>
        <div id="noFile">
          <div id="noFileMsg">No map loaded.<br>File &gt; Open Web Map</div>
          <div id="mapList" style="display:none">
            <div id="mapListTitle">Available Maps</div>
            <div id="mapListItems"></div>
          </div>
        </div>
      </div>
      <div id="panel">

        <div class="imgui-window" id="webMapInfo" style="display:none">
          <div class="imgui-title">Map Info</div>
          <div class="imgui-body">
            <div id="mapInfoContent" class="imgui-text"></div>
          </div>
        </div>

        <div class="imgui-window">
          <div class="imgui-title">Display</div>
          <div class="imgui-body">
            <div class="imgui-checkbox-row"><label class="imgui-checkbox"><input type="checkbox" id="cAccess" checked><span class="cb"></span>Show Access Grid</label><input type="color" class="color-swatch" id="clrAccess" value="#c73333" title="Access grid color"></div>
            <div class="imgui-checkbox-row"><label class="imgui-checkbox"><input type="checkbox" id="cPortals" checked><span class="cb"></span>Show Portals</label><input type="color" class="color-swatch" id="clrPortals" value="#00ffff" title="Portal color"></div>
            <div class="imgui-checkbox-row"><label class="imgui-checkbox"><input type="checkbox" id="cEffects" checked><span class="cb"></span>Show Effects</label><input type="color" class="color-swatch" id="clrEffects" value="#ffff00" title="Effect color"></div>
            <div class="imgui-checkbox-row"><label class="imgui-checkbox"><input type="checkbox" id="cSounds" checked><span class="cb"></span>Show Sounds</label><input type="color" class="color-swatch" id="clrSounds" value="#64ff64" title="Sound color"></div>
            <label class="imgui-checkbox"><input type="checkbox" id="cCovers" checked><span class="cb"></span>Show Covers</label>
            <label class="imgui-checkbox"><input type="checkbox" id="cScenes" checked><span class="cb"></span>Show Scenes</label>
            <div class="imgui-checkbox-row"><label class="imgui-checkbox"><input type="checkbox" id="cNpcs" checked><span class="cb"></span>Show NPCs</label><input type="color" class="color-swatch" id="clrNpcs" value="#ff8800" title="NPC color"></div>
            <div class="imgui-checkbox-row"><label class="imgui-checkbox"><input type="checkbox" id="cMobs" checked><span class="cb"></span>Show Mobs</label><input type="color" class="color-swatch" id="clrMobs" value="#ff4444" title="Mob color"></div>
          </div>
        </div>

        <div class="imgui-window" id="webMapObjects" style="display:none">
          <div class="imgui-title">Objects</div>
          <div class="imgui-body" style="padding:0">
            <div class="obj-tabs">
              <button class="obj-tab active" data-objtab="objPortals">Portals</button>
              <button class="obj-tab" data-objtab="objEffects">Effects</button>
              <button class="obj-tab" data-objtab="objSounds">Sounds</button>
              <button class="obj-tab" data-objtab="objCovers">Covers</button>
              <button class="obj-tab" data-objtab="objScenes">Scenes</button>
              <button class="obj-tab" data-objtab="objNpcs">NPCs</button>
              <button class="obj-tab" data-objtab="objMobs">Mobs</button>
            </div>
            <div id="objPortals" class="obj-content active"></div>
            <div id="objEffects" class="obj-content"></div>
            <div id="objSounds" class="obj-content"></div>
            <div id="objCovers" class="obj-content"></div>
            <div id="objScenes" class="obj-content"></div>
            <div id="objNpcs" class="obj-content"></div>
            <div id="objMobs" class="obj-content"></div>
          </div>
        </div>

      </div>
    </div>

    <div id="statusBar">
      <span id="sHover">Hover: (-1, -1)</span>
      <span id="sZoom">Zoom: 1.0</span>
      <span id="sMode">MAP</span>
      <span id="sFps">FPS: 0</span>
    </div>

    <div id="loadingOverlay" style="display:none">
      <div id="loadingCard">
        <div id="loadingTitle">Loading Map</div>
        <div id="loadingBarBg"><div id="loadingBarFill"></div></div>
        <div id="loadingStatus">Preparing...</div>
      </div>
    </div>
  </div>

  <dialog id="dlgGoTo">
    <div class="dlg-title">Go To Position</div>
    <div class="dlg-body">
      <div class="drow"><label>X:</label><input type="number" id="dGX" value="0"></div>
      <div class="drow"><label>Y:</label><input type="number" id="dGY" value="0"></div>
      <div id="dMapSize"></div>
      <div class="dactions">
        <button id="dGo">Go</button>
        <button id="dCenter">Center Map</button>
        <button id="dCancel">Cancel</button>
      </div>
    </div>
  </dialog>

  <dialog id="dlgAbout">
    <div class="dlg-title">Web Map Viewer</div>
    <div class="dlg-body">
      <div class="imgui-text">Conquer Online Web Map Viewer</div>
      <div class="imgui-text">Version: 3.0</div>
      <div class="imgui-text-dim">Thanks to: Spirited</div>
      <div class="dactions"><button id="dAboutOk">OK</button></div>
    </div>
  </dialog>

  <input type="file" id="webMapIn" webkitdirectory style="display:none">
  <input type="file" id="zipMapIn" accept=".zip" style="display:none">

  <script type="module" src="js/main.js"></script>
</body>

</html>
